<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1920">
<title>Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F2F5F7;--surface:#fff;--ink:#12232E;--muted:#5B6E7A;--line:#D5DEE3;--accent:#0A7C86;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1920;--surface:#132630;--ink:#E4EDF1;--muted:#8CA1AD;--line:#233844;--accent:#4FC3CC;--accent-ink:#0D1920;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;padding:20px 0 12px}
h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
#meta{font-size:.8rem;color:var(--muted)}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
input[type=search]:focus-visible,.chip:focus-visible,a.job:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.grp{padding:0 14px 12px}
.grp b{display:block;margin-bottom:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
#saved{margin:0;padding:0 14px 14px;font-size:.8rem;color:var(--muted)}
.chip{flex:none;font:inherit;font-size:.875rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
#note{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface);font-size:.875rem;color:var(--muted)}
h2{margin:24px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line);font-size:.9rem;font-weight:700;color:var(--muted)}
.job{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
a.job:active{background:var(--surface)}
.ring{width:28px;height:28px;margin-top:2px}
.rt{fill:none;stroke:var(--line);stroke-width:3}
.rf{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.job h3{margin:0;font-size:1rem;font-weight:600;line-height:1.3}
.job p{margin:2px 0 0;font-size:.875rem;color:var(--muted)}
.job p.co{color:var(--ink)}
.src{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Radar</h1><span id="meta"></span></header>
  <input type="search" id="q" placeholder="Buscar puesto, empresa o ciudad" aria-label="Buscar ofertas" autocomplete="off">
  <details id="filters"><summary id="fsum">Filtros</summary><div id="fbody"></div><p id="saved"></p></details>
  <p id="note" hidden></p>
  <main id="list" aria-live="polite"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const days=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/864e5));
let jobs=[],cfg={};
const F={Fuente:'Todas',Lugar:'Toda España',Modalidad:'Cualquiera',Nivel:'Todos'};
const MODE={Remoto:'remoto','Híbrido':'hibrido',Presencial:'presencial'};
const MLAB={remoto:'remoto',hibrido:'híbrido',presencial:'presencial'};
const isJr=j=>j.junior??/\b(junior|jr)\b/i.test(j.title);

function ring(n){
  const r=10,c=2*Math.PI*r,f=Math.max(.1,1-Math.min(n,14)/14);
  return `<svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle class="rt" cx="14" cy="14" r="${r}"/><circle class="rf" cx="14" cy="14" r="${r}" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 14 14)"/></svg>`;
}
const when=n=>n===0?'hoy':n===1?'ayer':`hace ${n} días`;
const group=n=>n===0?'Hoy':n<=7?'Esta semana':'Anteriores';

function row(j){
  const n=days(j.posted),ok=/^https?:\/\//.test(j.url||'');
  const open=ok?`a class="job" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer"`:'div class="job"';
  return `<${open}>${ring(n)}<div><h3>${esc(j.title)}</h3><p class="co">${esc(j.company)}</p><p>${esc(j.location)}${MLAB[j.modality]?', '+MLAB[j.modality]:''}, ${when(n)}</p></div><span class="src">${esc(j.source)}</span></${ok?'a':'div'}>`;
}

function render(){
  const t=norm($('#q').value);
  const list=jobs
    .filter(j=>(F.Fuente==='Todas'||j.source===F.Fuente)
      &&(F.Lugar==='Toda España'||norm(j.location).includes(norm(F.Lugar)))
      &&(F.Modalidad==='Cualquiera'||j.modality===MODE[F.Modalidad])
      &&(F.Nivel==='Todos'||isJr(j))
      &&(!cfg.antiguedad_maxima_dias||days(j.posted)<=cfg.antiguedad_maxima_dias)
      &&norm(`${j.title} ${j.company} ${j.location}`).includes(t))
    .sort((a,b)=>new Date(b.posted)-new Date(a.posted));
  if(!list.length){$('#list').innerHTML='<p class="empty">No hay ofertas con estos filtros.</p>';return}
  let html='',g='';
  for(const j of list){const k=group(days(j.posted));if(k!==g){g=k;html+=`<h2>${k}</h2>`}html+=row(j)}
  $('#list').innerHTML=html;
}

function chips(){
  const local=(cfg.ubicaciones||[]).filter(u=>u.tipo==='local').map(u=>u.nombre);
  const G={Fuente:['Todas',...new Set(jobs.map(j=>j.source))],Lugar:['Toda España',...local],Modalidad:['Cualquiera','Remoto','Híbrido','Presencial'],Nivel:['Todos','Junior']};
  $('#fbody').innerHTML=Object.entries(G).map(([g,o])=>`<div class="grp"><b>${g}</b><div class="row">${o.map(n=>`<button class="chip" aria-pressed="${n===F[g]}" data-g="${g}" data-s="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>`).join('');
  const k=Object.keys(F).filter(g=>F[g]!==G[g][0]).length;
  $('#fsum').textContent=k?`Filtros (${k})`:'Filtros';
}

$('#fbody').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;F[b.dataset.g]=b.dataset.s;chips();render()});
$('#q').addEventListener('input',render);

Promise.all([fetch('config.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})),fetch('jobs.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()})]).then(([c,d])=>{
  cfg=c;jobs=d.jobs||[];
  if(c.puestos)$('#saved').textContent='Búsqueda guardada: '+[...c.puestos,...(c.similares||[])].join(', ')+(c.antiguedad_maxima_dias?`. Últimos ${c.antiguedad_maxima_dias} días.`:'');
  if(d.updated)$('#meta').textContent='Actualizado '+new Date(d.updated).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  if(d.sample){const n=$('#note');n.hidden=false;n.textContent='Estas son ofertas de ejemplo. Las reales llegarán cuando conectemos las fuentes.'}
  chips();render();
}).catch(()=>{$('#list').innerHTML='<p class="empty">No se pudieron cargar las ofertas. Comprueba tu conexión e inténtalo de nuevo.</p>'});

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
